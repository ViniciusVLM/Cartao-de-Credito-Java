<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Abra sua conta VaultBank">
  <title>Abrir conta | VaultBank</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar__logo"><svg viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2"><ellipse cx="20" cy="20" rx="17" ry="6.5"/><ellipse cx="20" cy="20" rx="17" ry="6.5" transform="rotate(60 20 20)"/><ellipse cx="20" cy="20" rx="17" ry="6.5" transform="rotate(-60 20 20)"/><circle cx="20" cy="20" r="3.4" fill="#FFB84D" stroke="none"/></svg>Vault<span>Bank</span></a>
    <div class="navbar__links" id="auth-links"></div>
  </nav>

  <main class="auth-page">
    <div class="auth-card auth-card--largo">
      <div class="auth-card__header">
        <h1>Abrir conta</h1>
        <p>Seu cartão é gerado assim que a conta for criada.</p>
      </div>
      <form id="cadastro-form">
        <fieldset>
          <legend>Dados pessoais</legend>
          <div class="form-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" class="form-control" required autocomplete="name">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" required maxlength="14" inputmode="numeric">
            </div>
            <div class="form-group">
              <label for="rg">RG</label>
              <input type="text" id="rg" class="form-control" placeholder="00.000.000-0" required maxlength="12">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="nacionalidade">Nacionalidade</label>
              <input type="text" id="nacionalidade" class="form-control" placeholder="Brasileira" required>
            </div>
            <div class="form-group">
              <label for="nascimento">Data de nascimento</label>
              <input type="date" id="nascimento" class="form-control" required autocomplete="bday">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Contato e endereço</legend>
          <div class="form-row">
            <div class="form-group">
              <label for="email">E-mail</label>
              <input type="email" id="email" class="form-control" placeholder="seu@email.com" required autocomplete="email">
            </div>
            <div class="form-group">
              <label for="telefone">Telefone</label>
              <input type="text" id="telefone" class="form-control" placeholder="(11) 99999-9999" required maxlength="15" inputmode="tel" autocomplete="tel">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="cep">CEP</label>
              <input type="text" id="cep" class="form-control" placeholder="00000-000" required maxlength="9" inputmode="numeric" autocomplete="postal-code">
            </div>
            <div class="form-group">
              <label for="estado">Estado</label>
              <select id="estado" class="form-control" required>
                <option value="">Selecione</option>
                <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
                <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
                <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
                <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
                <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
                <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
                <option selected>SP</option><option>SE</option><option>TO</option>
              </select>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Senha de acesso</legend>
          <div class="form-row">
            <div class="form-group">
              <label for="senha">Senha</label>
              <input type="password" id="senha" class="form-control" placeholder="Mínimo de 6 caracteres" required minlength="6" autocomplete="new-password">
            </div>
            <div class="form-group">
              <label for="senha2">Repita a senha</label>
              <input type="password" id="senha2" class="form-control" required minlength="6" autocomplete="new-password">
            </div>
          </div>
        </fieldset>

        <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
      </form>
      <div class="auth-card__footer">
        <p>Já tem conta? <a href="login.html">Entrar</a></p>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('cpf').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      e.target.value = v;
    });

    document.getElementById('telefone').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      v = v.replace(/(\d{2})(\d)/, '($1) $2').replace(/(\d{5})(\d)/, '$1-$2');
      e.target.value = v;
    });

    document.getElementById('cep').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 8) v = v.slice(0, 8);
      v = v.replace(/(\d{5})(\d)/, '$1-$2');
      e.target.value = v;
    });

    document.getElementById('cadastro-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const senha = document.getElementById('senha').value;
      const senha2 = document.getElementById('senha2').value;
      if (senha !== senha2) { showToast('As duas senhas estão diferentes. Digite a mesma senha nos dois campos.', 'error'); return; }

      const data = {
        nome: document.getElementById('nome').value.trim(),
        cpf: document.getElementById('cpf').value.trim(),
        rg: document.getElementById('rg').value.trim(),
        email: document.getElementById('email').value.trim(),
        telefone: document.getElementById('telefone').value.trim(),
        dataNascimento: document.getElementById('nascimento').value,
        nacionalidade: document.getElementById('nacionalidade').value.trim(),
        cep: document.getElementById('cep').value.trim(),
        estado: document.getElementById('estado').value,
        senha: senha
      };

      const result = await DB.cadastrarCliente(data);
      if (result.error) { showToast(result.error, 'error'); return; }
      showToast('Conta criada. Seu cartão já está pronto, entre para ver.', 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    });
  </script>
</body>
</html>
