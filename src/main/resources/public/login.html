<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entre na sua conta VaultBank">
  <title>Entrar | VaultBank</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar__logo">Vault<span>Bank</span></a>
    <div class="navbar__links" id="auth-links"></div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-card__header">
        <h1>Entrar</h1>
        <p>Use o CPF e a senha cadastrados.</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" required maxlength="14" inputmode="numeric" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" class="form-control" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>
      <div class="auth-card__footer">
        <p>Ainda não tem conta? <a href="cadastro.html">Abrir conta</a></p>
      </div>
      <div class="demo-box">
        <strong>Contas de demonstração</strong>
        Admin: <code>000.000.000-00</code> / <code>admin123</code><br>
        Cliente: <code>123.456.789-00</code> / <code>senha123</code>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('cpf').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      e.target.value = v;
    });

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const cpf = document.getElementById('cpf').value.trim();
      const senha = document.getElementById('senha').value;
      const user = await Auth.login(cpf, senha);
      if (user) {
        showToast('Login feito. Abrindo seu painel.', 'success');
        setTimeout(() => {
          window.location.href = user.isAdmin ? 'admin.html' : 'dashboard.html';
        }, 800);
      } else {
        showToast('CPF ou senha incorretos. Confira e tente de novo.', 'error');
      }
    });
  </script>
</body>
</html>
