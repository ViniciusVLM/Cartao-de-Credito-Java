<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crie sua conta VaultBank gratuitamente">
  <title>VaultBank - Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar__logo">Vault<span>Bank</span></a>
    <div class="navbar__links" id="auth-links"></div>
  </nav>

  <div class="auth-page" style="padding-top: 7rem;">
    <div class="auth-card card fade-in-up" style="max-width: 600px;">
      <div class="auth-card__header">
        <h1>Crie sua Conta 🚀</h1>
        <p>Preencha seus dados para abrir sua conta VaultBank</p>
      </div>
      <form id="cadastro-form">
        <h3 style="color: var(--gold-400); margin-bottom: 1rem; font-size: 1rem;">📋 Dados Pessoais</h3>
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" class="form-control" placeholder="Seu nome completo" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" required maxlength="14">
          </div>
          <div class="form-group">
            <label for="rg">RG</label>
            <input type="text" id="rg" class="form-control" placeholder="00.000.000-0" required maxlength="12">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="nacionalidade">Nacionalidade</label>
            <input type="text" id="nacionalidade" class="form-control" placeholder="Brasileiro" required>
          </div>
          <div class="form-group">
            <label for="nascimento">Data de Nascimento</label>
            <input type="date" id="nascimento" class="form-control" required>
          </div>
        </div>

        <h3 style="color: var(--gold-400); margin: 1.5rem 0 1rem; font-size: 1rem;">📞 Contato</h3>
        <div class="form-row">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
          </div>
          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" class="form-control" placeholder="(11) 99999-9999" required maxlength="15">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="cep">CEP</label>
            <input type="text" id="cep" class="form-control" placeholder="00000-000" required maxlength="9">
          </div>
          <div class="form-group">
            <label for="estado">Estado</label>
            <select id="estado" class="form-control" required>
              <option value="">Selecione...</option>
              <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
              <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
              <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
              <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
              <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
              <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
              <option selected>SP</option><option>SE</option><option>TO</option>
            </select>
          </div>
        </div>

        <h3 style="color: var(--gold-400); margin: 1.5rem 0 1rem; font-size: 1rem;">🔒 Segurança</h3>
        <div class="form-row">
          <div class="form-group">
            <label for="senha">Crie sua Senha</label>
            <input type="password" id="senha" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
          </div>
          <div class="form-group">
            <label for="senha2">Confirme a Senha</label>
            <input type="password" id="senha2" class="form-control" placeholder="Repita a senha" required minlength="6">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem; font-size: 1rem; padding: 1rem;">Criar Minha Conta →</button>
      </form>
      <div class="auth-card__footer">
        <p>Já tem conta? <a href="login.html">Faça login aqui</a></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // CPF mask
    document.getElementById('cpf').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      e.target.value = v;
    });

    // Phone mask
    document.getElementById('telefone').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      v = v.replace(/(\d{2})(\d)/, '($1) $2').replace(/(\d{5})(\d)/, '$1-$2');
      e.target.value = v;
    });

    // CEP mask
    document.getElementById('cep').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 8) v = v.slice(0, 8);
      v = v.replace(/(\d{5})(\d)/, '$1-$2');
      e.target.value = v;
    });

    document.getElementById('cadastro-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const senha = document.getElementById('senha').value;
      const senha2 = document.getElementById('senha2').value;
      if (senha !== senha2) { showToast('As senhas não coincidem!', 'error'); return; }

      const data = {
        nome: document.getElementById('nome').value.trim(),
        cpf: document.getElementById('cpf').value.trim(),
        rg: document.getElementById('rg').value.trim(),
        email: document.getElementById('email').value.trim(),
        telefone: document.getElementById('telefone').value.trim(),
        dataNascimento: document.getElementById('nascimento').value,
        nacionalidade: document.getElementById('nacionalidade').value.trim(),
        cep: document.getElementById('cep').value.trim(),
        estado: document.getElementById('estado').value,
        senha: senha
      };

      const result = DB.cadastrarCliente(data);
      if (result.error) { showToast(result.error, 'error'); return; }
      showToast('Conta criada com sucesso! Seu cartão foi gerado automaticamente.', 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    });
  </script>
</body>
</html>
