<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Faça login na sua conta VaultBank">
  <title>VaultBank - Entrar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar__logo">Vault<span>Bank</span></a>
    <div class="navbar__links" id="auth-links"></div>
  </nav>

  <div class="auth-page">
    <div class="auth-card card fade-in-up">
      <div class="auth-card__header">
        <h1>Bem-vindo de volta 👋</h1>
        <p>Entre na sua conta VaultBank</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" required maxlength="14">
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" class="form-control" placeholder="Sua senha" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 0.5rem;">Entrar</button>
      </form>
      <div class="auth-card__footer">
        <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
      </div>
      <div style="margin-top:1.2rem; padding:1rem; border-radius:var(--radius-sm); background:var(--surface-light); font-size:0.82rem; color:var(--text-muted);">
        <strong style="color:var(--gold-400);">Contas de demonstração:</strong><br>
        Admin: <code>000.000.000-00</code> / <code>admin123</code><br>
        Usuário: <code>123.456.789-00</code> / <code>senha123</code>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // CPF mask
    document.getElementById('cpf').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      e.target.value = v;
    });

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const cpf = document.getElementById('cpf').value.trim();
      const senha = document.getElementById('senha').value;
      const user = Auth.login(cpf, senha);
      if (user) {
        showToast('Login realizado com sucesso!', 'success');
        setTimeout(() => {
          window.location.href = user.isAdmin ? 'admin.html' : 'dashboard.html';
        }, 800);
      } else {
        showToast('CPF ou senha inválidos.', 'error');
      }
    });
  </script>
</body>
</html>
